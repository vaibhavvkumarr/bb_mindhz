name: binaural_beats
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.10.4

dependencies:
  audio_video_progress_bar: ^2.0.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/



